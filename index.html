<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Volquetes - V9.0 (Gestión Avanzada)</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f4f9; 
            height: 100vh; 
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Evita doble scroll */
        }

        /* 1. PANEL SUPERIOR */
        .panel-superior {
            flex-shrink: 0;
            background-color: #ffffff;
            padding: 15px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-bottom: 3px solid #0056b3;
            z-index: 50;
        }

        .fila-controles {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        textarea { 
            flex-grow: 1;
            height: 50px; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px;
            font-size: 14px;
            resize: none;
        }

        button {
            padding: 0 15px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            height: 50px;
            transition: background 0.2s;
        }
        .btn-cargar { background-color: #007bff; }
        .btn-cargar:hover { background-color: #0056b3; }
        .btn-reset { background-color: #dc3545; }
        .btn-reset:hover { background-color: #a71d2a; }

        /* Contadores */
        .fila-datos {
            display: flex;
            gap: 20px;
        }
        .caja-dato {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            border: 1px solid rgba(0,0,0,0.1);
            font-size: 1em;
        }
        .verde { background-color: #d4edda; color: #155724; }
        .amarillo { background-color: #fff3cd; color: #856404; }

        /* 2. TABLA (CON SCROLL) */
        .contenedor-tabla {
            flex-grow: 1;
            overflow-y: auto; /* Scroll vertical activado */
            background: white;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
            text-align: left;
            white-space: nowrap;
        }

        /* Encabezados Sticky */
        thead tr th {
            position: sticky;
            top: 0;
            z-index: 40;
            background-color: #212529;
            color: white;
            border-bottom: 2px solid #000;
        }

        /* Primera Columna Sticky */
        tbody td:first-child, thead th:first-child {
            position: sticky;
            left: 0;
            background-color: #f8f9fa;
            z-index: 45;
            border-right: 3px solid #ccc;
            font-weight: bold;
            min-width: 90px;
        }
        thead th:first-child {
            background-color: #212529;
            color: white;
            z-index: 50;
        }

        /* Estados de Fila */
        .fila-pendiente { background-color: #e3f2fd; } /* Azul claro */
        .fila-listo { background-color: #d1e7dd; font-style: italic; color: #555; } /* Verde claro */
        .fila-espera { background-color: #fff; }

        input[type="checkbox"] {
            transform: scale(1.6);
            margin-left: 10px;
            cursor: pointer;
        }
        
        .hora { font-weight: bold; color: #555; font-size: 0.95em; }
        .hora.salida { color: #b02a37; } 

        /* --- MODALES (VENTANAS EMERGENTES) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay.activo {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center;
            min-width: 300px;
        }
        .modal-content h3 { margin-top: 0; color: #333; }
        .modal-botones {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-modal {
            padding: 12px;
            font-size: 14px;
            border-radius: 5px;
            border: none;
            color: white;
            cursor: pointer;
        }
        .btn-azul { background-color: #0d6efd; }
        .btn-rojo { background-color: #dc3545; }
        .btn-verde { background-color: #198754; }
        .btn-gris { background-color: #6c757d; }

    </style>
</head>
<body>

    <div class="panel-superior">
        <div class="fila-controles">
            <textarea id="txtPlacas" placeholder="Pega las placas aquí (ej: ABC-123)..."></textarea>
            <button class="btn-cargar" onclick="window.app.intentarCargar()">CARGAR</button>
            <button class="btn-reset" onclick="window.app.intentarReset()">RESETEAR</button>
        </div>

        <div class="fila-datos">
            <div class="caja-dato verde">
                COMPLETADOS: <span id="numDescargados">0</span>
            </div>
            <div class="caja-dato amarillo">
                EN INTERIOR: <span id="numAdentro">0</span>
            </div>
        </div>
    </div>

    <div class="contenedor-tabla">
        <table>
            <thead>
                <tr>
                    <th>PLACA</th>
                    <th>ENTRADA</th>
                    <th>HORA INGRESO</th>
                    <th>SALIDA</th>
                    <th>HORA SALIDA</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
                </tbody>
        </table>
    </div>

    <div id="modalReset" class="modal-overlay">
        <div class="modal-content">
            <h3>¿Qué deseas resetear?</h3>
            <div class="modal-botones">
                <button class="btn-modal btn-rojo" onclick="window.app.ejecutarReset('todo')">BORRAR TODAS LAS PLACAS</button>
                <button class="btn-modal btn-azul" onclick="window.app.ejecutarReset('checks')">SOLO BORRAR CHECKS Y HORAS</button>
                <button class="btn-modal btn-gris" onclick="window.app.cerrarModales()">CANCELAR</button>
            </div>
        </div>
    </div>

    <div id="modalCarga" class="modal-overlay">
        <div class="modal-content">
            <h3>Ya hay placas registradas</h3>
            <p>¿Qué deseas hacer con las nuevas placas ingresadas?</p>
            <div class="modal-botones">
                <button class="btn-modal btn-verde" onclick="window.app.ejecutarCarga('agregar')">AGREGAR A LA LISTA ACTUAL</button>
                <button class="btn-modal btn-rojo" onclick="window.app.ejecutarCarga('nueva')">BORRAR TODO Y CREAR NUEVA LISTA</button>
                <button class="btn-modal btn-gris" onclick="window.app.cerrarModales()">CANCELAR</button>
            </div>
        </div>
    </div>

    <script>
        window.app = {
            datos: {},
            
            iniciar: function() {
                try {
                    var memoria = localStorage.getItem('volquetes_v9');
                    if (memoria) {
                        this.datos = JSON.parse(memoria);
                    }
                } catch (error) {
                    this.datos = {};
                }
                this.dibujarTabla();
            },

            guardar: function() {
                localStorage.setItem('volquetes_v9', JSON.stringify(this.datos));
                this.dibujarTabla();
            },

            /* --- LÓGICA DE CARGA --- */
            intentarCargar: function() {
                var texto = document.getElementById('txtPlacas').value;
                if (!texto.trim()) {
                    alert("El campo está vacío.");
                    return;
                }

                // Si no hay datos, cargamos directo
                if (Object.keys(this.datos).length === 0) {
                    this.ejecutarCarga('nueva');
                } else {
                    // Si hay datos, mostramos el modal
                    document.getElementById('modalCarga').classList.add('activo');
                }
            },

            ejecutarCarga: function(modo) {
                var texto = document.getElementById('txtPlacas').value;
                var lineas = texto.split(/[\n,]+/); // Separa por enter o comas
                var contador = 0;

                if (modo === 'nueva') {
                    this.datos = {}; // Limpiar todo
                }

                lineas.forEach(function(linea) {
                    var placa = linea.trim().toUpperCase();
                    // Filtramos placas vacías
                    if (placa.length > 1) {
                        // Si es modo agregar, solo añadimos si no existe
                        if (!window.app.datos[placa]) {
                            window.app.datos[placa] = {
                                ingreso: false, horaIngreso: '',
                                salida: false, horaSalida: ''
                            };
                            contador++;
                        }
                    }
                });

                this.cerrarModales();
                document.getElementById('txtPlacas').value = '';
                this.guardar();
                
                if (contador === 0 && modo === 'agregar') {
                    alert("No se agregaron placas nuevas (ya existían todas).");
                }
            },

            /* --- LÓGICA DE RESET --- */
            intentarReset: function() {
                document.getElementById('modalReset').classList.add('activo');
            },

            ejecutarReset: function(tipo) {
                if (tipo === 'todo') {
                    this.datos = {};
                } else if (tipo === 'checks') {
                    // Solo limpiamos los estados
                    for (var placa in this.datos) {
                        this.datos[placa].ingreso = false;
                        this.datos[placa].horaIngreso = '';
                        this.datos[placa].salida = false;
                        this.datos[placa].horaSalida = '';
                    }
                }
                this.cerrarModales();
                this.guardar();
            },

            cerrarModales: function() {
                document.getElementById('modalReset').classList.remove('activo');
                document.getElementById('modalCarga').classList.remove('activo');
            },

            obtenerHora: function() {
                var fecha = new Date();
                return fecha.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            },

            /* --- LÓGICA DE CLICS --- */
            clickEntrada: function(placa) {
                var reg = this.datos[placa];
                reg.ingreso = !reg.ingreso;
                
                if (reg.ingreso) {
                    reg.horaIngreso = this.obtenerHora();
                } else {
                    // Si desmarca entrada, se borra todo
                    reg.horaIngreso = "";
                    reg.salida = false;
                    reg.horaSalida = "";
                }
                this.guardar();
            },

            clickSalida: function(placa) {
                var reg = this.datos[placa];
                if (!reg.ingreso) return; 

                reg.salida = !reg.salida;
                
                if (reg.salida) {
                    reg.horaSalida = this.obtenerHora();
                } else {
                    reg.horaSalida = "";
                }
                this.guardar();
            },

            /* --- ORDENAMIENTO DE 3 NIVELES --- */
            ordenarPlacas: function(datos) {
                var lista = Object.keys(datos);

                lista.sort(function(a, b) {
                    var dA = datos[a];
                    var dB = datos[b];

                    var aTerminado = dA.ingreso && dA.salida;
                    var bTerminado = dB.ingreso && dB.salida;

                    var aEnProceso = dA.ingreso && !dA.salida;
                    var bEnProceso = dB.ingreso && !dB.salida;

                    // NIVEL 1: Los que ya SALIERON van primero (Arriba)
                    if (aTerminado && !bTerminado) return -1;
                    if (!aTerminado && bTerminado) return 1;
                    
                    if (aTerminado && bTerminado) {
                        // Entre los salidos, ordenar por hora de salida (el que salió primero arriba)
                        if (dA.horaSalida < dB.horaSalida) return -1;
                        if (dA.horaSalida > dB.horaSalida) return 1;
                        return 0;
                    }

                    // NIVEL 2: Los que están ADENTRO van después
                    if (aEnProceso && !bEnProceso) return -1;
                    if (!aEnProceso && bEnProceso) return 1;

                    if (aEnProceso && bEnProceso) {
                        // Entre los de adentro, ordenar por hora de entrada
                        if (dA.horaIngreso < dB.horaIngreso) return -1;
                        if (dA.horaIngreso > dB.horaIngreso) return 1;
                        return 0;
                    }

                    // NIVEL 3: Los que no han marcado nada (Abajo)
                    // Se mantienen en orden alfabético o de lista
                    return 0;
                });

                return lista;
            },

            dibujarTabla: function() {
                var tbody = document.getElementById('cuerpoTabla');
                tbody.innerHTML = ""; 

                var listaOrdenada = this.ordenarPlacas(this.datos);
                var nSalida = 0;
                var nAdentro = 0;

                if (listaOrdenada.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding:20px; color:#888;'>Lista vacía.</td></tr>";
                    this.actualizarContadores(0,0);
                    return;
                }

                listaOrdenada.forEach(function(placa) {
                    var info = window.app.datos[placa];
                    var tr = document.createElement('tr');
                    
                    var claseFila = 'fila-espera';
                    if (info.ingreso && info.salida) {
                        claseFila = 'fila-listo';
                        nSalida++;
                    } else if (info.ingreso) {
                        claseFila = 'fila-pendiente';
                        nAdentro++;
                    }
                    tr.className = claseFila;

                    tr.innerHTML = `
                        <td>${placa}</td>
                        <td>
                            <input type="checkbox" 
                                ${info.ingreso ? 'checked' : ''} 
                                onchange="window.app.clickEntrada('${placa}')">
                        </td>
                        <td class="hora">${info.horaIngreso}</td>
                        <td>
                            <input type="checkbox" 
                                ${info.salida ? 'checked' : ''} 
                                ${!info.ingreso ? 'disabled' : ''} 
                                onchange="window.app.clickSalida('${placa}')">
                        </td>
                        <td class="hora ${info.salida ? 'salida' : ''}">${info.horaSalida}</td>
                    `;
                    tbody.appendChild(tr);
                });

                this.actualizarContadores(nSalida, nAdentro);
            },

            actualizarContadores: function(salida, adentro) {
                document.getElementById('numDescargados').innerText = salida;
                document.getElementById('numAdentro').innerText = adentro;
            }
        };

        window.onload = function() {
            window.app.iniciar();
        };
    </script>
</body>
</html>
